name: CI

on:
  push:
    branches: ["**"]   # every branch, whatever it is named (e.g. v0.6.5)
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Only the linter: it reads the source, so the plugin's own dependencies are not needed.
      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.kipy && format(', kicad-python {0}', matrix.kipy) || '' }}${{ matrix.pardiso && ', PARDISO' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Python each platform's KiCad runs plugins with:
        # - Windows: KiCad's own Python 3.11.
        # - Linux: the system Python (3.10 on Ubuntu 22.04, 3.12 on 24.04, 3.13 on
        #   Debian 13 and Fedora 42). 3.10 is also plugin.json's min_version.
        # - macOS: KiCad bundles Python 3.9, which is too old for KiPI, so users point
        #   KiCad at a newer Python (README).
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.12" }
          # The oldest kicad-python requirements.txt allows: the API calls must exist there too.
          - { os: ubuntu-latest,  python: "3.11", kipy: "0.7.1" }
          # With the optional multithreaded direct solver (README: faster solves).
          - { os: windows-latest, python: "3.11", pardiso: true }
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries for VTK / Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Install exactly what KiCad will install into the plugin venv, plus test tools.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pin kicad-python
        if: matrix.kipy
        run: pip install "kicad-python==${{ matrix.kipy }}"

      - name: Install optional PARDISO solver
        if: matrix.pardiso
        run: |
          pip install pypardiso
          python -c "from kipi.core.solver import direct; assert direct.backend() == 'pardiso', direct.backend_note()"

      - name: Validate plugin manifest
        run: python -m kipy.packaging validate .

      - name: Import GUI modules
        run: python -c "import kipi.gui.main_window, kipi.gui.viewer3d, kipi.dc.gui.pi_panel, kipi_entry"

      # One collapsible log group per test folder (core, dc, ac, gui, ...), found rather
      # than listed so a new folder is never skipped. Every folder runs even after one
      # fails, and the step fails if any did. tests/accuracy runs last, in its own job.
      - name: Run tests
        shell: bash
        run: |
          failed=""
          for dir in tests/*/; do
            name=$(basename "$dir")
            case "$name" in helpers|data|accuracy|__pycache__) continue ;; esac
            echo "::group::tests/$name"
            python -m pytest -v "$dir" || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=Tests failed::in tests/{${failed# }}"
            exit 1
          fi

  # Solver accuracy (#70): the boards in examples/validation solved and compared with hand
  # calculations. Last, once lint and every test job have passed, so a failure here
  # means the solvers' answers moved rather than something else breaking.
  accuracy:
    name: Solver accuracy (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Solver accuracy against hand calculations
        run: python -m pytest -v tests/accuracy

  # KiCad installs the plugin's dependencies with pip, and users rarely have a compiler, so
  # every dependency needs a binary wheel for the Python their KiCad uses. Python 3.14
  # (Ubuntu 26.04, Fedora 43) is not covered yet: triangle and pyamg publish no 3.14 wheels.
  # Until they do, a missing wheel is reported as a warning rather than failing the job.
  wheels:
    name: Binary wheels (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install with binary wheels only
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! pip install --only-binary=:all: -r requirements.txt 2>&1 | tee pip.log; then
            missing=$(grep -o 'No matching distribution found for [^ ]*' pip.log | sed 's/.* //' | sort -u | tr '\n' ' ')
            echo "::warning title=No Python ${{ matrix.python }} wheels::${missing:-see the log}"
          fi
