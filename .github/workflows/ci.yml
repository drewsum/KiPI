name: CI

on:
  push:
    branches: ["**"]   # every branch, whatever it is named (e.g. v0.6.5)
    paths-ignore: ["**.md"]   # README and changelog edits change no code (docs/*.html is tested)
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels that branch's run still going: only the latest commit's
# result matters, and a backlog of runs queues the next ones behind it (#115).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Only the linter: it reads the source, so the plugin's own dependencies are not needed.
      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.kipy && format(', kicad-python {0}', matrix.kipy) || '' }}${{ matrix.pardiso && ', PARDISO' || '' }})
    runs-on: ${{ matrix.os }}
    # A whole job takes 2-5 minutes; pytest-timeout ends a hung test well before this.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The Python each platform's KiCad runs plugins with:
        # - Windows: KiCad's own Python 3.11.
        # - Linux: the system Python (3.10 on Ubuntu 22.04, 3.12 on 24.04, 3.13 on
        #   Debian 13 and Fedora 42). 3.10 is also plugin.json's min_version.
        # - macOS: KiCad bundles Python 3.9, which is too old for KiPI, so users point
        #   KiCad at a newer Python (README).
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.12" }
          # The oldest kicad-python requirements.txt allows: the API calls must exist there too.
          - { os: ubuntu-latest,  python: "3.11", kipy: "0.7.1" }
          # With the optional multithreaded direct solver (README: faster solves).
          - { os: windows-latest, python: "3.11", pardiso: true }
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries for VTK / Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # What the plugin's venv ends up with (KiCad's requirements.txt, then KiPI's first
      # click adds requirements-standalone.txt, #7), plus test tools.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-standalone.txt -r requirements-dev.txt

      - name: Pin kicad-python
        if: matrix.kipy
        run: pip install "kicad-python==${{ matrix.kipy }}"

      - name: Install optional PARDISO solver
        if: matrix.pardiso
        run: |
          pip install pypardiso
          python -c "from kipi.core.solver import direct; assert direct.backend() == 'pardiso', direct.backend_note()"

      - name: Validate plugin manifest
        run: python -m kipy.packaging validate .

      - name: Import GUI modules
        run: python -c "import kipi.gui.main_window, kipi.gui.viewer3d, kipi.dc.gui.pi_panel, kipi_entry"

      # One collapsible log group per test folder (core, dc, ac, gui, ...), found rather
      # than listed so a new folder is never skipped. Every folder runs even after one
      # fails, and the step fails if any did. tests/accuracy runs last, in its own job.
      - name: Run tests
        shell: bash
        run: |
          failed=""
          for dir in tests/*/; do
            name=$(basename "$dir")
            case "$name" in helpers|data|accuracy|__pycache__) continue ;; esac
            echo "::group::tests/$name"
            python -m pytest -v "$dir" || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=Tests failed::in tests/{${failed# }}"
            exit 1
          fi

  # Each KiCad release KiPI supports, as its own step so the pipeline shows which passed
  # (#106). The IPC API steps talk to the fake KiCad (tests/helpers/kicad_fake.py), which
  # answers as that release does and refuses what it did not have yet. The board-file
  # steps read boards saved by each KiCad major version. The test jobs above run all of
  # this too; a test checks this list matches kicad_fake.VERSIONS and the fixture boards.
  kicad:
    name: KiCad versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-standalone.txt -r requirements-dev.txt

      - name: KiCad 9.0.0 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.0]"

      - name: KiCad 9.0.1 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.1]"

      - name: KiCad 9.0.3 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.3]"

      - name: KiCad 9.0.5 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.5]"

      - name: KiCad 9.0.7 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.7]"

      - name: KiCad 9.0.8 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[9.0.8]"

      - name: KiCad 10.0.0 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[10.0.0]"

      - name: KiCad 10.0.1 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[10.0.1]"

      - name: KiCad 10.0.6 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/core/test_kicad_versions.py -k "[10.0.6]"

      - name: KiCad 9 board file (.kicad_pcb)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/sources/test_kicad_pcb_reader.py -k "[features_v9]"

      - name: KiCad 10 board file (.kicad_pcb)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/sources/test_kicad_pcb_reader.py -k "[features]"

  # Solver accuracy (#70): the boards in examples/validation solved and compared with hand
  # calculations. Last, once lint and every test job have passed, so a failure here
  # means the solvers' answers moved rather than something else breaking.
  accuracy:
    name: Solver accuracy (${{ matrix.os }})
    needs: [lint, test]
    # Only for pull requests into main (and on demand): it guards a release's solver
    # accuracy and takes longer than the other tests.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-standalone.txt -r requirements-dev.txt

      - name: Solver accuracy against hand calculations
        run: python -m pytest -v tests/accuracy

  # KiCad and KiPI's first click install the plugin's dependencies with pip, and users rarely
  # have a compiler, so
  # every dependency needs a binary wheel for the Python their KiCad uses. Python 3.14
  # (Ubuntu 26.04, Fedora 43) is not covered yet: triangle and pyamg publish no 3.14 wheels.
  # Until they do, a missing wheel is reported as a warning rather than failing the job.
  wheels:
    name: Binary wheels (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install with binary wheels only
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! pip install --only-binary=:all: -r requirements.txt -r requirements-standalone.txt 2>&1 | tee pip.log; then
            missing=$(grep -o 'No matching distribution found for [^ ]*' pip.log | sed 's/.* //' | sort -u | tr '\n' ' ')
            echo "::warning title=No Python ${{ matrix.python }} wheels::${missing:-see the log}"
          fi
