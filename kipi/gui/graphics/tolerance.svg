<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect x="0" y="0" width="300" height="150" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="54" y="18" fill="{volts}" text-anchor="end">in V</text>
    <text x="206" y="18" fill="{pct}">in % of nominal</text>
    <rect x="62" y="30" width="138" height="80" fill="{grid}"/>
    <path d="M62,30 H200" stroke="{max}" stroke-width="1.8" stroke-dasharray="5,3"/>
    <path d="M62,110 H200" stroke="{min}" stroke-width="1.8" stroke-dasharray="5,3"/>
    <path d="M62,70 H200" stroke="{fg}" stroke-width="2.4"/>
    <text x="131" y="45" fill="{max}" text-anchor="middle">max</text>
    <text x="131" y="64" fill="{fg}" text-anchor="middle">nominal</text>
    <text x="131" y="104" fill="{min}" text-anchor="middle">min</text>
    <g fill="{volts}" text-anchor="end">
      <text x="54" y="34">3.465 V</text><text x="54" y="74">3.3 V</text><text x="54" y="114">3.135 V</text>
    </g>
    <g fill="{pct}">
      <text x="206" y="34">+5 %</text><text x="206" y="74">0 %</text><text x="206" y="114">−5 %</text>
    </g>
    <text x="150" y="138" fill="{muted}" text-anchor="middle" font-size="10">nominal: the set voltage of the VRM driving the rail</text>
  </g>
</svg>
