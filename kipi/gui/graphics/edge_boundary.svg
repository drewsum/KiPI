<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170">
  <rect x="0" y="0" width="300" height="170" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- the board from above, its left edge clamped by a heatframe -->
    <text x="150" y="20" fill="{fg}" text-anchor="middle">heat leaves through the held edge</text>
    <rect x="60" y="34" width="200" height="110" fill="{grid}" stroke="{muted}" stroke-width="1.2"/>
    <text x="210" y="138" fill="{muted}" text-anchor="middle">board</text>
    <!-- the strip held at the frame's temperature -->
    <rect x="60" y="34" width="26" height="110" fill="{strip}" fill-opacity="0.35" stroke="none"/>
    <path d="M60,150 H86 M60,146 V154 M86,146 V154" stroke="{strip}" stroke-width="1.2" fill="none"/>
    <text x="73" y="165" fill="{strip}" text-anchor="middle">strip</text>
    <!-- the edge itself -->
    <path d="M60,34 V144" stroke="{edge}" stroke-width="5" stroke-linecap="round"/>
    <rect x="14" y="30" width="40" height="118" rx="3" fill="none" stroke="{muted}" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="34" y="86" fill="{edge}" text-anchor="middle">held</text>
    <text x="34" y="100" fill="{edge}" text-anchor="middle">at T</text>
    <!-- a hot part, its heat running to the edge -->
    <rect x="176" y="72" width="34" height="34" fill="{warn}" fill-opacity="0.6" stroke="{fg}" stroke-width="1"/>
    <g stroke="{muted}" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M170,80 H102 M110,74 L102,80 L110,86"/>
      <path d="M170,98 H102 M110,92 L102,98 L110,104"/>
    </g>
  </g>
</svg>
