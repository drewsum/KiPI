<svg xmlns="http://www.w3.org/2000/svg" width="280" height="140" viewBox="0 0 280 140">
  <rect x="0" y="0" width="280" height="140" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="40" y="24" fill="{muted}">output voltage</text>
    <rect x="30" y="36" width="160" height="60" fill="{grid}"/>
    <path d="M30,36 H190" stroke="{max}" stroke-width="1.8" stroke-dasharray="5,3"/>
    <path d="M30,96 H190" stroke="{min}" stroke-width="1.8" stroke-dasharray="5,3"/>
    <path d="M30,66 H190" stroke="{fg}" stroke-width="2.4"/>
    <path d="M30,74 C60,58 80,82 110,60 S160,80 190,58" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <text x="196" y="40" fill="{max}">max, e.g. +1 %</text>
    <text x="196" y="70" fill="{fg}">set voltage</text>
    <text x="196" y="100" fill="{min}">min, e.g. −1 %</text>
    <text x="30" y="124" fill="{muted}">the output may sit anywhere in the band</text>
  </g>
</svg>
