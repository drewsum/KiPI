<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect x="0" y="0" width="300" height="150" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- the ground copper, all of it kept -->
    <rect x="14" y="14" width="272" height="100" fill="{grid}" stroke="{muted}" stroke-width="1"/>
    <!-- the rail's copper and the margin around it -->
    <rect x="24" y="24" width="56" height="80" fill="{fg}" fill-opacity="0.25"
          stroke="{fg}" stroke-width="1.4"/>
    <text x="52" y="68" fill="{fg}" text-anchor="middle">rail</text>
    <path d="M118,14 V114" stroke="{near}" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M80,94 H118 M80,90 V98 M118,90 V98" stroke="{near}" stroke-width="1"/>
    <text x="99" y="108" fill="{near}" text-anchor="middle">margin</text>
    <!-- vias near the rail: mesh graded down to min edge around them -->
    <g stroke="{near}" fill="none">
      <circle cx="98" cy="40" r="3" stroke-width="1.6"/>
      <circle cx="98" cy="40" r="6" stroke-width="0.8"/>
      <circle cx="98" cy="40" r="10" stroke-width="0.6"/>
      <circle cx="98" cy="40" r="15" stroke-width="0.5"/>
      <circle cx="98" cy="72" r="3" stroke-width="1.6"/>
      <circle cx="98" cy="72" r="6" stroke-width="0.8"/>
      <circle cx="98" cy="72" r="10" stroke-width="0.6"/>
    </g>
    <!-- far vias: the mesh stays at max edge -->
    <g stroke="{muted}" stroke-width="1.6" fill="none">
      <circle cx="160" cy="36" r="3"/><circle cx="200" cy="36" r="3"/>
      <circle cx="240" cy="36" r="3"/><circle cx="160" cy="76" r="3"/>
      <circle cx="200" cy="76" r="3"/><circle cx="240" cy="76" r="3"/>
    </g>
    <text x="200" y="100" fill="{muted}" text-anchor="middle">far vias: not graded</text>
    <text x="150" y="134" fill="{near}" text-anchor="middle">vias near the rail: graded to min edge</text>
  </g>
</svg>
