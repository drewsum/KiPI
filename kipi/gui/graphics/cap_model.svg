<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190">
  <rect x="0" y="0" width="280" height="190" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <!-- the model: C, ESL and ESR in series -->
    <circle cx="18" cy="34" r="3" fill="{muted}"/>
    <path d="M21,34 H55 M63,34 H98 M142,34 H172 M228,34 H259" stroke="{muted}" stroke-width="1.6" fill="none"/>
    <path d="M55,20 V48 M63,20 V48" stroke="{c}" stroke-width="2.4"/>
    <path d="M98,34 a5.5,6 0 0 1 11,0 a5.5,6 0 0 1 11,0 a5.5,6 0 0 1 11,0 a5.5,6 0 0 1 11,0" stroke="{l}" stroke-width="2" fill="none"/>
    <path d="M172,34 L177,25 L184,43 L191,25 L198,43 L205,25 L212,43 L219,25 L224,34 H228" stroke="{r}" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <circle cx="262" cy="34" r="3" fill="{muted}"/>
    <text x="59" y="64" fill="{c}">C</text>
    <text x="120" y="64" fill="{l}">ESL</text>
    <text x="200" y="64" fill="{r}">ESR</text>
    <!-- its impedance: falls with C, bottoms out at ESR, rises with ESL -->
    <path d="M34,80 V168 H266" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <text x="22" y="90" fill="{muted}">|Z|</text>
    <text x="262" y="182" fill="{muted}">f</text>
    <path d="M40,84 L132,150" stroke="{c}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M132,150 Q146,160 160,150" stroke="{r}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M160,150 L252,84" stroke="{l}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="40" y="160" fill="{c}" text-anchor="start">1 / (2πf·C)</text>
    <text x="146" y="180" fill="{r}">ESR</text>
    <text x="264" y="160" fill="{l}" text-anchor="end">2πf·ESL</text>
  </g>
</svg>
