<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <rect x="0" y="0" width="320" height="160" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- die, bumps, package substrate, balls, board -->
    <rect x="70" y="22" width="90" height="18" rx="2" fill="{grid}" stroke="{muted}"/>
    <text x="115" y="35" fill="{fg}" text-anchor="middle" font-size="10">die</text>
    <g fill="{muted}">
      <circle cx="82" cy="44" r="3"/><circle cx="96" cy="44" r="3"/><circle cx="110" cy="44" r="3"/>
      <circle cx="124" cy="44" r="3"/><circle cx="138" cy="44" r="3"/><circle cx="152" cy="44" r="3"/>
    </g>
    <rect x="40" y="48" width="150" height="20" rx="2" fill="{grid}" stroke="{muted}"/>
    <text x="115" y="62" fill="{fg}" text-anchor="middle" font-size="10">package (N-port model)</text>
    <g fill="{muted}">
      <circle cx="52" cy="75" r="6"/><circle cx="72" cy="75" r="6"/><circle cx="92" cy="75" r="6"/>
      <circle cx="138" cy="75" r="6"/><circle cx="158" cy="75" r="6"/><circle cx="178" cy="75" r="6"/>
    </g>
    <rect x="16" y="82" width="200" height="14" fill="{grid}"/>
    <text x="116" y="93" fill="{muted}" text-anchor="middle" font-size="10">PCB</text>
    <!-- PCB port: across the balls, rail to ground -->
    <path d="M52,75 V112 M72,75 V112" stroke="{pcb}" stroke-width="1.6"/>
    <path d="M52,112 H72" stroke="{pcb}" stroke-width="1.6"/>
    <circle cx="62" cy="112" r="4" fill="none" stroke="{pcb}" stroke-width="1.6"/>
    <text x="16" y="130" fill="{pcb}">PCB port: the part's</text>
    <text x="16" y="143" fill="{pcb}">pins, rail to ground</text>
    <!-- Die port: across the bumps -->
    <path d="M152,44 V14 H212 M138,44 V8 H212" stroke="{die}" stroke-width="1.6" fill="none"/>
    <text x="216" y="14" fill="{die}" font-size="10">die port: a</text>
    <text x="216" y="27" fill="{die}" font-size="10">probe with no</text>
    <text x="216" y="40" fill="{die}" font-size="10">place on the board</text>
    <!-- An open port -->
    <path d="M178,75 V112 M158,75 V112" stroke="{open}" stroke-width="1.4" stroke-dasharray="3,2"/>
    <text x="196" y="116" fill="{open}">other ports: left</text>
    <text x="196" y="129" fill="{open}">open or shorted</text>
  </g>
</svg>
