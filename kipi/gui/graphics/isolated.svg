<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170">
  <rect x="0" y="0" width="300" height="170" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <rect x="110" y="30" width="80" height="64" rx="5" stroke="{fg}" stroke-width="1.6" fill="none"/>
    <path d="M150,24 V100" stroke="{muted}" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="150" y="18" fill="{muted}" text-anchor="middle" font-size="10">isolation</text>
    <!-- input side -->
    <path d="M20,48 H106" stroke="{inp}" stroke-width="2"/>
    <rect x="104" y="43" width="10" height="10" fill="{inp}"/>
    <text x="22" y="40" fill="{inp}">input pins</text>
    <path d="M20,80 H106" stroke="{ignd}" stroke-width="2"/>
    <rect x="104" y="75" width="10" height="10" fill="{ignd}"/>
    <text x="22" y="72" fill="{ignd}">input ground pins</text>
    <text x="22" y="96" fill="{muted}" font-size="10">input current returns</text>
    <text x="22" y="108" fill="{muted}" font-size="10">to its source here</text>
    <!-- output side -->
    <path d="M194,48 H280" stroke="{out}" stroke-width="2"/>
    <rect x="186" y="43" width="10" height="10" fill="{out}"/>
    <text x="278" y="40" fill="{out}" text-anchor="end">output pins</text>
    <path d="M194,80 H230 V118" stroke="{ognd}" stroke-width="2" fill="none"/>
    <rect x="186" y="75" width="10" height="10" fill="{ognd}"/>
    <path d="M216,118 H244 M221,123 H239 M226,128 H234" stroke="{ognd}" stroke-width="2"/>
    <text x="278" y="72" fill="{ognd}" text-anchor="end">output ground</text>
    <text x="250" y="122" fill="{ognd}">0 V</text>
    <text x="150" y="152" fill="{muted}" text-anchor="middle" font-size="10">its output ground pins hold the output side's</text>
    <text x="150" y="164" fill="{muted}" text-anchor="middle" font-size="10">ground at 0 V: that ground's reference</text>
  </g>
</svg>
