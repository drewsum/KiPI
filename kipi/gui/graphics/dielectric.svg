<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190">
  <rect x="0" y="0" width="300" height="190" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- the code: low temperature, high temperature, capacitance change over that range -->
    <g fill="{x7r}" font-size="18" font-weight="bold" text-anchor="middle">
      <text x="60" y="28">X</text><text x="150" y="28">7</text><text x="240" y="28">R</text>
    </g>
    <g fill="{muted}" font-size="10" text-anchor="middle">
      <text x="60" y="46">from −55 °C</text><text x="150" y="46">to +125 °C</text>
      <text x="240" y="46">within ±15 %</text>
    </g>
    <!-- typical capacitance change against temperature (TEMP_CURVES) -->
    <path d="M44,62 V166 H288" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <text x="38" y="82" fill="{muted}" text-anchor="end">ΔC</text>
    <path d="M44,166 v4 M137.6,166 v4 M207.8,166 v4 M254.6,166 v4" stroke="{muted}" stroke-width="1.2"/>
    <g fill="{muted}" text-anchor="middle">
      <text x="44" y="182">−55</text><text x="137.6" y="182">25</text>
      <text x="207.8" y="182">85</text><text x="254.6" y="182">125 °C</text>
    </g>
    <path d="M44,78 H254.6" stroke="{fg}" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M73.3,154.3 L108.4,105.3 L125.9,78 L137.6,78 L166.8,110.7 L207.8,159.8" stroke="{muted}" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M44,88.9 L79.1,82.4 L137.6,78 L207.8,82.4 L254.6,91.1" stroke="{x7r}" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <text x="258" y="74" fill="{fg}">C0G</text>
    <text x="258" y="98" fill="{x7r}">X7R</text>
    <text x="214" y="152" fill="{muted}">Y5V</text>
  </g>
</svg>
