<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect x="0" y="0" width="300" height="150" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <!-- the rail, and a ferrite bead filtered net off it -->
    <path d="M20,30 H160" stroke="{nets}" stroke-width="2" fill="none"/>
    <text x="70" y="22" fill="{nets}">+1V0</text>
    <path d="M160,30 H176" stroke="{fg}" stroke-width="2"/>
    <rect x="176" y="23" width="28" height="14" rx="3" fill="{fg}"/>
    <text x="190" y="52" fill="{muted}">bead</text>
    <path d="M204,30 H280" stroke="{nets}" stroke-width="2" fill="none"/>
    <text x="244" y="22" fill="{nets}">+1V0_PLL</text>
    <!-- the part's supply pins on each net -->
    <g stroke="{per}" stroke-width="1.8" fill="none">
      <path d="M44,30 V82 M68,30 V82 M92,30 V82 M116,30 V82 M236,30 V82"/>
      <path d="M40,76 l4,6 l4,-6 M64,76 l4,6 l4,-6 M88,76 l4,6 l4,-6 M112,76 l4,6 l4,-6 M232,76 l4,6 l4,-6"/>
    </g>
    <text x="80" y="70" fill="{per}">4 × I / 5</text>
    <text x="258" y="70" fill="{per}">I / 5</text>
    <rect x="28" y="84" width="232" height="34" rx="4" stroke="{fg}" stroke-width="1.6" fill="none"/>
    <text x="144" y="105" fill="{fg}">one part: total current I</text>
    <text x="150" y="138" fill="{muted}">a load on each net, its share of I</text>
  </g>
</svg>
