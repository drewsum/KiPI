<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180">
  <rect x="0" y="0" width="300" height="180" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- the load current: up by the step, back down once the rail has settled -->
    <text x="12" y="20" fill="{muted}">I</text>
    <path d="M24,62 H286" stroke="{muted}" stroke-width="1" fill="none"/>
    <path d="M24,62 H60 L76,22 H190 L206,62 H286" stroke="{fg}" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M120,22 V62" stroke="{step}" stroke-width="1.6"/>
    <path d="M116,26 L120,22 L124,26 M116,58 L120,62 L124,58" stroke="{step}" stroke-width="1.4" fill="none"/>
    <text x="126" y="46" fill="{step}">ΔI</text>
    <path d="M60,70 H76" stroke="{slew}" stroke-width="1.6"/>
    <path d="M60,66 V74 M76,66 V74" stroke="{slew}" stroke-width="1.2"/>
    <text x="80" y="78" fill="{slew}">t_rise = ΔI / slew rate</text>
    <!-- the rail: dips on the step, rises on the release, settles back to its DC value -->
    <text x="12" y="98" fill="{muted}">V</text>
    <path d="M24,124 H286" stroke="{muted}" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <text x="284" y="118" fill="{muted}" text-anchor="end">DC value</text>
    <path d="M24,124 H62 C70,124 74,152 84,154 C96,156 104,128 120,124 C134,121 150,124 190,124 C198,124 202,96 212,94 C224,92 232,120 248,124 H286" stroke="{v}" stroke-width="2" fill="none"/>
    <text x="90" y="170" fill="{v}">undershoot</text>
    <text x="218" y="90" fill="{v}">overshoot</text>
  </g>
</svg>
