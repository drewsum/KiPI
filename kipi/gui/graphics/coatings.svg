<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170">
  <rect x="0" y="0" width="300" height="170" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- heat leaving the copper for the air, through the coatings -->
    <text x="150" y="26" fill="{fg}" text-anchor="middle">heat to the air crosses the coatings</text>
    <g stroke="{muted}" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M40,90 V44 M34,52 L40,44 L46,52"/>
      <path d="M262,84 V44 M256,52 L262,44 L268,52"/>
    </g>
    <!-- the laminate -->
    <rect x="14" y="110" width="272" height="44" fill="{grid}" stroke="{muted}" stroke-width="1"/>
    <text x="200" y="138" fill="{muted}" text-anchor="middle">laminate</text>
    <!-- outer copper: two traces and a pad -->
    <g fill="{fg}" fill-opacity="0.55" stroke="{fg}" stroke-width="1">
      <rect x="28" y="100" width="56" height="10"/>
      <rect x="112" y="100" width="40" height="10"/>
      <rect x="186" y="100" width="70" height="10"/>
    </g>
    <text x="56" y="128" fill="{fg}" text-anchor="middle">copper</text>
    <!-- solder mask over all of it but the pad -->
    <g fill="{mask}" fill-opacity="0.45" stroke="{mask}" stroke-width="1.2">
      <rect x="14" y="94" width="92" height="16"/>
      <rect x="158" y="94" width="128" height="16"/>
    </g>
    <text x="72" y="86" fill="{mask}" text-anchor="middle">solder mask</text>
    <text x="132" y="90" fill="{muted}" text-anchor="middle">pad</text>
    <!-- silkscreen printed on the mask -->
    <rect x="196" y="87" width="48" height="7" fill="{silk}" fill-opacity="0.6" stroke="{silk}" stroke-width="1.2"/>
    <text x="220" y="78" fill="{silk}" text-anchor="middle">silkscreen</text>
  </g>
</svg>
