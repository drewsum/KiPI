<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <rect x="0" y="0" width="280" height="160" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- axes: log |Z| over log f -->
    <path d="M30,18 V128 H264" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <text x="22" y="24" fill="{muted}" text-anchor="end">|Z|</text>
    <text x="264" y="144" fill="{muted}" text-anchor="end">f (log)</text>
    <!-- the DCR floor, the inductive slope, the resistive peak, the capacitive fall -->
    <path d="M34,120 C50,120 58,118 66,112" stroke="{fg}" stroke-width="2" fill="none"/>
    <path d="M66,112 L150,48" stroke="{l}" stroke-width="2.5" fill="none"/>
    <path d="M150,48 C166,36 180,30 194,32 C210,34 222,52 244,84" stroke="{r}" stroke-width="2" fill="none"/>
    <!-- the point read off the datasheet -->
    <circle cx="108" cy="80" r="4" fill="{l}"/>
    <path d="M108,80 V128 M30,80 H108" stroke="{muted}" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <text x="108" y="142" fill="{l}" text-anchor="middle">f</text>
    <text x="40" y="76" fill="{l}">|Z|</text>
    <text x="84" y="58" fill="{l}" transform="rotate(-37 84 58)">inductive: 2πf·L</text>
    <text x="194" y="24" fill="{r}" text-anchor="middle">resistive peak</text>
    <text x="40" y="112" fill="{fg}">DCR</text>
  </g>
</svg>
